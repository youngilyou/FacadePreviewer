# previewer's own stitch pipeline config.
#
# Not a copy of config/pipeline.yaml or config/pipeline.dev_test.yaml from
# the main CheckCrack repo -- tuned separately because previewer's job is
# different (find unphotographed spots on the building, not precision
# crack measurement) and its images arrive pre-downscaled to 640x640
# during capture (see previewer/CLAUDE.local.md's capture-only redesign),
# which is already smaller than loftr.max_image_side below.
#
# Sections not needed by previewer's trimmed src/pipeline/runner.py
# (facade_segmentation, facade_assignment, tiling, crack, measurement) are
# intentionally omitted -- run_facade_poc doesn't read them.

matching:
  temporal_neighbor_count: 4
  # Fallback/upper-bound only -- the real spatial-proximity radius is now
  # auto-calibrated per capture from that capture's own GPS nearest-neighbor
  # distribution (src/matching/pair_selector.py's _auto_calibrate_radius), 3D
  # (horizontal+altitude), not a single fixed constant. This value is used
  # outright only when there isn't enough located imagery to calibrate from,
  # and otherwise clamps the auto-computed radius so a sparse/oddly-shaped
  # capture can't calibrate itself unreasonably large. 8m reflects today's
  # plain-GPS captures (a real 168-image facade run: auto-calibrated radius
  # landed well under this, matched-pair count 6217 -> 897) -- once the
  # planned RTK GPS upgrade lands, auto-calibration should pick that up on
  # its own (tighter measured neighbor spacing -> tighter computed radius)
  # without needing this value changed.
  max_gps_distance_m: 8
  max_view_angle_delta_deg: 20

loftr:
  pretrained: outdoor
  min_confidence: 0.50
  max_image_side: 640  # matches previewer's capture-time downscale, so LoFTR never has to resize down further

geometry:
  min_matches: 40          # slightly relaxed vs production's 50: 640x640 frames yield fewer raw keypoints than full-res DJI stills
  min_inliers: 25
  min_inlier_ratio: 0.35
  max_median_reprojection_error_px: 3.0
  ransac_reproj_threshold_px: 4.0

stitch:
  generate_analysis_mosaic: true  # hard-seam, no cross-fade (blend_analysis) -- for coverage-gap
  # measurement, not for people to look at. A hard seam through real content
  # (e.g. an AC unit split across two source images) looks exactly like a
  # "cut and pasted" artifact even when every pixel is genuine and correctly
  # placed -- see 2026-09-08 CLAUDE.local.md entry (user flagged this as
  # apparent fabrication; it's an intentional design tradeoff of THIS output,
  # not a stitching bug). generate_visual_mosaic below is the actual
  # human-viewing output (exposure-compensated multi-band blend_visual).
  generate_visual_mosaic: true
  analysis_feather_blend: false
  visual_multiband_blend: false
  multiband_num_bands: 5
  # 2026-09-28: user's 15-min field-use budget ("blend 안해도 됨") -- skip blend_visual's
  # exposure-compensation + multiband blend entirely and reuse blend_analysis's hard-seam
  # composite for visual_image too. See rectify_and_blend's own comment for the cost breakdown.
  fast_paste_only: true

colmap:
  enabled: true
  # "fallback": run 1st-stage LoFTR matching + pairwise-homography stitching
  # first, only fall through to COLMAP if that result's drift/coverage
  # fails the thresholds below.
  # "always" (default since 2026-09-13): skip LoFTR/stitching entirely and
  # go straight to a SINGLE COLMAP mapping+render pass on whatever images
  # are currently in the capture folder (2026-09-09 CLAUDE.local.md entry --
  # COLMAP never reuses the 1st stage's matches anyway, and every real
  # repetitive-facade capture so far has triggered fallback regardless, so
  # the 1st stage was pure wasted time on this project's actual data --
  # LoFTR matching alone runs 20+ minutes on a real capture). Images that
  # barely see the wall (sky/rooftop-equipment shots) are flagged as a
  # warning after that single pass (`{facade}_off_wall_warning.json`), never
  # auto-excluded/auto-rerun -- the operator already has a manual
  # review-and-remove step for captured frames before "스캔 시작" (see
  # MainViewModel's CapturedFrames sidebar), and a real second COLMAP pass
  # on top of that would cost minutes for a job manual curation already
  # does in seconds (2026-09-13, explicit user call: automatic 2-pass
  # tried first, then dropped in favor of this for exactly that reason) --
  # see src/pipeline/runner.py::_run_colmap_only_pipeline for the full
  # reasoning. User's explicit purpose for this app: on-site "did I miss a
  # spot" coverage check, not final crack measurement (that's the separate
  # main CheckCrackV2 repo on full-res rsync'd originals) -- so speed over
  # accuracy is the right tradeoff here.
  mode: always
  max_drift_px: 10.0
  max_seam_drift_px: 20.0
  max_coverage_gap_ratio: 0.5
  # 2026-09-09: images the 2D chain can't place at all (no matching path to
  # the reference image, or zero passing edges to anything) are silently
  # dropped from the mosaic -- a real photo just never appears in the
  # output. coverage_gap_ratio alone can miss this (it's measured only over
  # the placed subset's own auto-shrunk canvas, so a whole disconnected
  # island can vanish while the remaining canvas still looks fully covered).
  # 0.03 = trigger COLMAP fallback once more than 3% of this facade's
  # matchable images would otherwise be lost this way.
  max_unreachable_ratio: 0.03
  # 2026-09-29: ported from the main CheckCrackV2 repo -- feeds LoFTR (not SIFT) matches into
  # COLMAP's database (src/matching/loftr_colmap_bridge.py). Root-cause fix for the exact
  # repetitive-facade mismatch problem this app fought all session on this same BACK building
  # (registration stuck around 10-30% with SIFT, or a geometrically degenerate chain-drifted
  # result once more of it did register) -- confirmed in the main repo on this building's FRONT
  # facade: 422/422 images registered with LoFTR. Needs a matcher (src/matching/loftr_matcher.py,
  # already used for previewer's own 1st-stage H-chain path) and real GPU time per pair, so it's
  # config-gated rather than unconditional -- set false to fall back to plain SIFT matching.
  use_loftr_matching: true
  # 2026-09-29: skip a photo taken within this GPS distance of the last photo kept (drops the
  # hover duplicates at each column's top/bottom, keeps every climbing photo). 1.5 on the 429-photo
  # BACK facade keeps 216. 0 = use all photos. See runner.py for why this replaced image_stride.
  min_photo_spacing_m: 1.5
  # Lighter bundle adjustment during mapping. BACK, 215 photos: COLMAP 4.4 -> 1.6 min (~12 -> ~9 min
  # total), same result (coverage 0.937 vs 0.940). On all 429 photos it left a hole at the top.
  fast_bundle_adjustment: false

wall_filter:
  # 2026-09-28: pre-filter obvious non-wall frames (sky/mountains/distant ground, a serpentine
  # flight's column-turn frames) before COLMAP ever sees them -- see
  # src/capture/image_catalog.py's filter_wall_like_images docstring for why (root-caused a real
  # 499-image run whose incremental_mapping fragmented into repeated from-scratch restarts, 932+
  # next_image_callback firings for 499 actual images, still not done after ~15 minutes).
  # 2026-09-29: default flipped to OFF -- user's explicit call ("Colmap -> 필터 -> colmap ->
  # 스티칭 하지 말고 Colmap -> 스티칭"), and confirmed on real SD-card photos this heuristic's
  # threshold (calibrated on previewer's own tiny 320px video frames) doesn't transfer at all
  # (measured 18-62 on real photos vs the 800 threshold -- would have excluded every image). With
  # LoFTR matching (colmap.use_loftr_matching below) genuinely non-wall content just fails to
  # match anything and stays unregistered on its own, no separate filter stage needed.
  enabled: false
  # Grayscale Laplacian variance (cv2.Laplacian(...).var()) -- a standard blur/texture-density
  # metric, higher means more fine detail/edges. Calibrated empirically against a real capture:
  # pure landscape/aerial frames measured ~250-800, a frame showing even a partial close wall
  # section measured ~900-1000+, a full close-up facade frame measured ~1900. 800 sits in the gap,
  # erring toward keeping a borderline frame over excluding one with real wall content. Retune
  # here (no code change) if a facade's legitimate wall is itself unusually low-texture (e.g. a
  # plain unpainted concrete wall) and starts getting wrongly excluded.
  min_laplacian_variance: 800.0

dense:
  # GPU-only (COLMAP's dense-stereo module has no CPU implementation --
  # confirmed via upstream pycolmap.PatchMatchOptions, which only exposes a
  # gpu_index selector, never a CPU mode).
  #
  # When available, this runs pycolmap's patch_match_stereo to recover a
  # true per-pixel depth for each registered image, meant to correct pixels
  # that are genuinely off the fitted facade plane (balconies, ledges, AC
  # units) instead of letting the flat-plane homography shear/stretch them
  # to the wrong place -- see src/geometry/dense_depth.py.
  #
  # DEFAULT OFF (2026-09-09 real-data test): the current per-pixel
  # forward-scatter implementation, tested end to end on the real 140-image
  # FRONT dataset, makes output quality WORSE, not better -- it covers the
  # entire mosaic (sky, mountains, and the wall itself, not just balconies)
  # in salt-and-pepper speckle. Root cause: even geometric-consistency-
  # filtered PatchMatch depth is noisy enough (especially near windows/glass)
  # that ordinary flat-wall depth noise gets misclassified as "off-plane" and
  # scattered essentially everywhere; raising deviation_threshold_m from
  # 0.15 to 0.5 did not meaningfully fix it, so this isn't just a threshold-
  # tuning problem -- the classification needs to be spatially coherent
  # (e.g. require a local neighborhood majority / minimum connected-blob
  # size before trusting a pixel as truly off-plane, not a lone noisy
  # sample) before this is safe to enable. Do not flip this to true without
  # that fix and a fresh before/after visual check.
  enable: false
  # PatchMatch's own internal working resolution (independent of each
  # image's true undistorted size) -- higher is slower but finds finer
  # off-plane detail. 1600 keeps a full ~150-image facade's dense run to
  # roughly 15-25 minutes on a single consumer GPU (RTX 40-series); the
  # 800px smoke-tested value processed 140 images in 8 minutes.
  max_image_size: 1600
  # Cross-checks each pixel's depth against neighboring views before
  # accepting it (COLMAP's own recommended default) -- roughly doubles dense
  # runtime over photometric-only, worth it here because a wrong/noisy depth
  # doesn't just cost sharpness, it visibly misplaces the pixel on the
  # canvas.
  geom_consistency: true
  # How far (meters, along the plane normal) a pixel's real 3D position has
  # to be from the fitted plane before it's treated as genuinely off-plane
  # and depth-corrected. Below this, ordinary photogrammetric/plane-fit
  # noise on the actual wall surface would otherwise get needlessly
  # re-projected through noisier per-pixel depth for zero benefit.
  deviation_threshold_m: 0.15
  # Upper bound (meters) on how far off the plane a pixel may be and still
  # get depth-corrected. Real balconies/ledges are realistically well under
  # this; sky and distant terrain are not -- and unlike the flat-homography
  # path (where a near-grazing ray toward the sky typically diverges well
  # outside any image's local canvas ROI and gets clipped away for free),
  # orthographic projection has no such natural divergence, so without this
  # cap a background pixel tens of meters back can still coincidentally land
  # *inside* the visible canvas and paint sky/mountain color over real wall
  # content. Confirmed on real data: ~5-30% of "off-plane" background pixels
  # otherwise land in-bounds.
  max_deviation_m: 3.0
  gpu_index: 0
